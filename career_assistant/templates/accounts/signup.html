{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — CareerAssist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: #F8FAFC; display: flex; align-items: center; justify-content: center; }
        .signup-card {
            width: 100%; max-width: 520px; padding: 2.5rem;
            background: #fff; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08); margin: 2rem;
        }
        .signup-card .form-control, .signup-card .form-select {
            border-radius: 10px; padding: 0.7rem 1rem;
            border: 1.5px solid #E2E8F0;
        }
        .signup-card .form-control:focus, .signup-card .form-select:focus {
            border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .btn-signup {
            background: linear-gradient(135deg, #4F46E5, #3730A3);
            border: none; color: #fff; border-radius: 10px;
            padding: 0.75rem; font-weight: 600; width: 100%;
        }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,0.3); color: #fff; }
    </style>
</head>
<body>
<div class="signup-card">
    <div class="text-center mb-4">
        <i class="bi bi-briefcase-fill display-5" style="color:#4F46E5"></i>
        <h2 class="fw-bold mt-2">Create Account</h2>
        <p class="text-muted">Join CareerAssist today</p>
    </div>
    {% if messages %}{% for message in messages %}<div class="alert alert-danger py-2 rounded-3">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select name="role" class="form-select">
                <option value="jobseeker">Job Seeker</option>
                <option value="recruiter">Recruiter</option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password1" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input type="password" name="password2" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn btn-signup mt-2"><i class="bi bi-person-plus me-2"></i>Create Account</button>
    </form>
    <p class="text-center text-muted mt-3 mb-0">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold" style="color:#4F46E5">Sign In</a></p>
</div>
</body>
</html>
